name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mock + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements-ci.txt

      - name: Run API tests without model
        env:
          NK_MOCK: "1"
        run: pytest -q server/test_api.py

  extension:
    name: Extension (JS + Firefox lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: |
          node --check extension/languages.js
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js

      - name: Test language registry and packs
        run: |
          node scripts/test-extension.js
          python3 scripts/check-language-packs.py
          python3 scripts/check-pack-collisions.py
          python3 tests/check-pack-collisions.test.py
          python3 scripts/check-training-data.py

      - name: Install jsdom
        run: npm install --no-save --no-package-lock jsdom

      - name: Test content, privacy and cloud in jsdom
        run: |
          node tests/content.test.js
          node tests/privacy.test.js
          node tests/cloud-gating.test.js

      - name: Validate manifests
        run: |
          python3 - <<'PY'
          import json
          for path in [
              "extension/manifest.json",
              "extension/manifest.firefox.json",
              "extension/manifest.universal.json",
          ]:
              with open(path, encoding="utf-8") as handle:
                  json.load(handle)
              print("ok", path)
          PY

      - name: Build Firefox package
        run: ./scripts/build-firefox.sh

      - name: Lint Firefox extension
        run: npx --yes web-ext lint --source-dir dist/firefox

      - name: Package extension
        run: |
          ./scripts/package-extension.sh
          test -f dist/nkaplingua-extension.zip
          grep -q "NK_LANGUAGES" dist/package/universal/background.js
          test -d dist/package/universal/language-packs
          unzip -l dist/nkaplingua-extension.zip | head -20

  process:
    name: Journal d'évolution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérifier le journal append-only
        run: python3 scripts/check-evolution.py

  language-data:
    name: Données linguistiques
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérifier les données et le kit natif
        run: |
          python3 scripts/check-language-data.py
          python3 scripts/check-native-kit.py
          python3 scripts/check-language-packs.py
          python3 scripts/check-training-data.py

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject obvious committed secrets
        run: |
          if grep -RInE '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' \
            --exclude-dir=.git \
            --exclude-dir=.venv \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            .; then
            echo "Potential secret found. Remove it before merging."
            exit 1
          fi
          echo "No obvious secret pattern found."
