# Fragment à ajouter dans .github/workflows/ci.yml, sous `jobs:`.
# Nécessite un token GitHub avec le scope `workflow` pour être poussé.
process:
  name: Journal d'évolution
  runs-on: ubuntu-latest
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Vérifier le journal append-only
      run: python3 scripts/check-evolution.py
